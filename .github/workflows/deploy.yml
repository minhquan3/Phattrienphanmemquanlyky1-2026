name: Deploy .NET MVC to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Lấy source code từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 4. Build project
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      # 5. Publish project
      - name: Publish project
        run: dotnet publish **/*.csproj -c Release -o ./publish --no-build

      # 6. Tạo app_offline.htm để tạm dừng website
      - name: Stop Server
        run: |
          echo "<html><body><h1>Updating...</h1></body></html>" > app_offline.htm
          curl -s --ftp-pasv \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -T app_offline.htm \
            "ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm"

      # 7. Upload project lên MonsterASP
      - name: Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
          exclude: |
            **/app_offline.htm

      # 8. Xóa app_offline.htm để website hoạt động lại
      - name: Start Server
        if: always()
        run: |
          curl -s --ftp-pasv \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/" \
            -Q "-DELE /wwwroot/app_offline.htm" || true